<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribals Mod Menu</title>
    <!-- Gerekli JQuery Kütüphanesi -->
    <script src="https://jquery.com"></script>
    
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }
        /* Tribals Arayüz Tasarımı */
        #tribals-hack {
            position: absolute; top: 80px; left: 15px; z-index: 9999;
            cursor: move; background-color: rgba(0, 0, 0, 0.85); 
            border: 2px solid #00ff00; border-radius: 8px; 
            padding: 10px; width: 210px; box-shadow: 0 0 15px #00ff00;
        }
        #kalash-header {
            text-align: center; background: linear-gradient(90deg, #8b0000, #ff0000);
            color: #ffffff; font-size: 13.5px; font-weight: bold;
            padding: 6px; margin-bottom: 8px; border: 1px solid #ffffff;
            border-radius: 5px; text-shadow: 0 0 8px #fff; letter-spacing: 0.5px;
        }
        #esp-status, #aimbot-status {
            background-color: rgba(0, 0, 0, 0.4); border: 1px solid #00ff00;
            color: #00ff00; font-size: 14px; padding: 5px;
            margin: 5px 0; border-radius: 4px; display: block; font-weight: bold;
        }
        #esp, #aimbot { font-weight: bold; }
        .info-box {
            font-size: 11px; color: #aaa; text-align: center; margin-top: 8px;
        }
    </style>
</head>
<body>

    <!-- MENÜ ARAYÜZÜ -->
    <div id="tribals-hack">
        <div id="kalash-header">🎗 MAP AİMBOT</div>
        <p id="esp-status">ESP: <span id="esp">Disabled</span></p>
        <p id="aimbot-status">AimBot: <span id="aimbot">Disabled</span></p>
        <div class="info-box">Aç/Kapat: ESP için [-] | Aimbot için [C]</div>
    </div>

    <script>
        let espEnabled = false;
        let aimbotEnabled = false;

        $(document).ready(() => {
            // Sürüklenebilir Menü Özelliği (Draggable)
            $("#tribals-hack").on("mousedown", function (e) {
                const el = this;
                let isDragging = true;
                const offsetX = e.clientX - el.offsetLeft;
                const offsetY = e.clientY - el.offsetTop;
                
                function moveAt(e) {
                    if (isDragging) {
                        el.style.left = `${e.clientX - offsetX}px`;
                        el.style.top = `${e.clientY - offsetY}px`;
                    }
                }
                function stopDrag() {
                    isDragging = false;
                    document.removeEventListener("mousemove", moveAt);
                    document.removeEventListener("mouseup", stopDrag);
                }
                document.addEventListener("mousemove", moveAt);
                document.addEventListener("mouseup", stopDrag);
            });

            // Klavye Tuş Kontrolleri (Zararlı Logger Yazılımları Kaldırıldı)
            document.addEventListener('keydown', (q) => {
                if (q.key === '-') {
                    espEnabled = !espEnabled;
                    updateUI();
                }
                if (q.key.toLowerCase() === 'c') {
                    aimbotEnabled = !aimbotEnabled;
                    updateUI();
                }
            });
        });

        // Arayüzü Güncelleme Fonksiyonu
        function updateUI() {
            const espText = document.getElementById('esp');
            const aimbotText = document.getElementById('aimbot');
            
            if (espText) {
                espText.innerHTML = espEnabled ? 'Enabled' : 'Disabled';
                espText.style.color = espEnabled ? '#00ff00' : 'red';
                addGlowEffect(espText, espEnabled);
            }
            if (aimbotText) {
                aimbotText.innerHTML = aimbotEnabled ? 'Enabled' : 'Disabled';
                aimbotText.style.color = aimbotEnabled ? '#00ff00' : 'red';
                addGlowEffect(aimbotText, aimbotEnabled);
            }
        }

        function addGlowEffect(element, enabled) {
            element.style.textShadow = enabled
                ? '0 0 5px #00ff00, 0 0 10px #00ff00'
                : '0 0 5px red, 0 0 10px red';
        }
    </script>
</body>
</html>
